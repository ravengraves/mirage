name: Mirage CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build clang clang-tidy cppcheck

      - name: Build
        run: make -j2 build/libmirage.so build/libmirage_embedded.so

      - name: Test C libraries
        run: make -j2 check

      - name: Install Python bindings
        run: python -m pip install ./lang/python

      - name: Test Python bindings and C interoperability
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: make check-python
